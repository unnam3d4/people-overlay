name: v2.0 candidate - real-image x64 x86 and CCTV pixel replay
on:
  push:
    branches: [fix/cctv-validation-v20]
  workflow_dispatch:

# One CI generation is authoritative at a time. A new fix supersedes older
# photographic replay runs; inside the run v1.9 and v20 execute sequentially.
concurrency:
  group: cctv-v20-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Processing regressions and benchmark evaluator
        run: |
          cd src
          go test -v ./...
          cd ..
          python -m unittest discover -s scripts -p 'test_*.py' -v
      - uses: actions/download-artifact@v4
        with:
          run-id: 39614859651
          name: PeopleOverlay_v1.9_YOLO26n_Win7_11_Verified
          github-token: ${{ github.token }}
          path: BASE26
      - uses: actions/download-artifact@v4
        with:
          run-id: 39613297202
          name: PeopleOverlay_v1.8_Fast_CCTV_PersonLock_Win7
          github-token: ${{ github.token }}
          path: BASE8
      - name: Compile fresh Windows 7 application and pack both model choices
        run: |
          mkdir -p _output DIST
          for pair in 'amd64 x64' '386 x86'; do
            read -r goarch arch <<< "$pair"
            (cd src && CGO_ENABLED=0 GOOS=windows GOARCH="$goarch" go build -tags ncnn -trimpath -ldflags '-s -w -H windowsgui' -o "../_output/app-$arch.exe" .)
            python scripts/package_current.py --application "_output/app-$arch.exe" --donor "BASE26/PeopleOverlay_v1.9_YOLO26n_$arch.exe" --output "DIST/PeopleOverlay_v2.0_candidate_YOLO26n_$arch.exe"
            python scripts/package_current.py --application "_output/app-$arch.exe" --donor "BASE8/PeopleOverlay_Win7_NCNN_$arch.exe" --output "DIST/PeopleOverlay_v2.0_candidate_YOLOv8n_$arch.exe"
          done
          python scripts/build_benchmark_baseline.py --go "$(which go)" --work _output/baseline --output _output/baseline.exe
          python scripts/package_current.py --application _output/baseline.exe --donor BASE26/PeopleOverlay_v1.9_YOLO26n_x64.exe --output DIST/v19-benchmark-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST/*
          retention-days: 7

  # An immediately downloadable, explicitly NON-STABLE trial for actual
  # operator testing. Do not confuse this with the strict full-body quality
  # gate; on PETS2009 the 16-camera recall remains low.
  field-trial-portable:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST
      - name: Verify four self-contained models actually recognize people
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force trial-evidence | Out-Null
          foreach ($exe in Get-ChildItem 'DIST/PeopleOverlay_v2.0_candidate_YOLO*.exe') {
            $evidence = Join-Path (Resolve-Path trial-evidence).Path ($exe.BaseName + '.json')
            # windowsgui executables do not reliably block PowerShell's
            # call operator. Start-Process -Wait is mandatory for real proof.
            $p = Start-Process -FilePath $exe.FullName -ArgumentList @('--selftest', ('"' + $evidence + '"')) -WindowStyle Hidden -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Portable selftest failed: $($exe.Name), exit $($p.ExitCode)" }
            if (!(Test-Path -LiteralPath $evidence)) { throw "No selftest output for $($exe.Name)" }
            $r = Get-Content $evidence -Raw | ConvertFrom-Json
            if (!$r.passed -or $r.matched_people -ne 3 -or $r.blank_people -ne 0) { throw "Invalid person-image check: $($exe.Name)" }
          }
      - name: Build trial ZIP for real RVi/operator testing, clearly not a stable release
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force FIELD-TRIAL | Out-Null
          Get-ChildItem 'DIST/PeopleOverlay_v2.0_candidate_YOLO*.exe' | Copy-Item -Destination FIELD-TRIAL
          Get-ChildItem 'DIST/PeopleOverlay_v2.0_candidate_YOLO*.bundle.json' | Copy-Item -Destination FIELD-TRIAL
          Copy-Item README.md,BENCHMARK.md,LICENSE,THIRD_PARTY_NOTICES.txt FIELD-TRIAL
          @'
          PEOPLE OVERLAY AI v20 - TEST CANDIDATE, NOT STABLE RELEASE
          --------------------------------------------------------
          Use on a Windows test PC first, never rely on it for access
          control or safety-critical surveillance decisions.
          Choose x64 or x86, and YOLO26n or YOLOv8n (fallback).
          Only ONE EXE should run per Windows session.
          Launch the EXE, then right-click its system tray icon:
          choose the monitor showing RVi Operator, and select the
          appropriate camera-grid mode (single, 2x2, 3x3 or 4x4).
          Ctrl+Alt+F9 toggles detection. Ctrl+Alt+F10 exits.
          Fallback model and architectures may behave differently.
          Does NOT connect to RVi streams, network, cameras or drivers.
          Offline after delivery. No Python needed on test PC.
          Known issue: full-body recall on crowded real PETS2009 4x4
          mosaic is low, and body tracking gate is still failing.
          Genuine two-monitor RVi and Windows 7 tests NOT complete.
          GitHub Actions contains the exact test reports.
          If a monitor shows blank or old frames, use tray diagnostic
          and compatibility capture mode; report logs/screenshots only
          after checking your organization's privacy restrictions.
          '@ | Out-File -LiteralPath FIELD-TRIAL/READ-ME-FIRST.txt -Encoding utf8
          Compress-Archive -Path FIELD-TRIAL/* -DestinationPath PeopleOverlay_v20_FIELD_TRIAL_x64_x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PeopleOverlay_v20_FIELD_TRIAL_OFFLINE_x64_x86_NOT_STABLE
          path: PeopleOverlay_v20_FIELD_TRIAL_x64_x86.zip
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PeopleOverlay_v20_FIELD_TRIAL_real_person_selftests
          path: trial-evidence/
          retention-days: 30

  verify:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install pillow==12.1.1 psutil==7.2.2
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Execute unit/regression tests on Windows x64 and x86 (not Windows 7)
        shell: pwsh
        working-directory: src
        run: |
          $env:CGO_ENABLED = '0'
          $env:GOARCH = 'amd64'
          go test -tags ncnn ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows x64 Go tests failed' }
          $env:GOARCH = '386'
          go test -tags ncnn ./...
          if ($LASTEXITCODE -ne 0) { throw 'Windows x86 Go tests failed' }
      - name: Inspect actual physical monitor enumeration in portable x86 and x64 Windows EXEs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-results/monitors | Out-Null
          foreach ($name in @('PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe','PeopleOverlay_v2.0_candidate_YOLO26n_x86.exe')) {
            $exe = (Resolve-Path (Join-Path DIST $name)).Path
            $out = Join-Path (Resolve-Path benchmark-results/monitors).Path ($name + '.json')
            $p = Start-Process -FilePath $exe -ArgumentList @('--monitor-report', ('"' + $out + '"')) -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Monitor API probe failed for $name with $($p.ExitCode)" }
            $monitors = @(Get-Content $out -Raw | ConvertFrom-Json)
            if ($monitors.Count -lt 1 -or !$monitors[0].Primary) { throw "Primary Win32 monitor missing on $name" }
            foreach ($m in $monitors) {
              if ($m.Rect.Right -le $m.Rect.Left -or $m.Rect.Bottom -le $m.Rect.Top) { throw "Invalid monitor rectangle on $name" }
            }
            Write-Host "${name}: $($monitors.Count) actual monitors enumerated. CI does NOT exercise a true multi-monitor desktop."
          }
      - name: Actual embedded-model positive and negative self-tests on both architectures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-results | Out-Null
          foreach ($exe in Get-ChildItem DIST/PeopleOverlay*.exe) {
            $report = Join-Path (Resolve-Path benchmark-results).Path ($exe.BaseName + '-selftest.json')
            $p = Start-Process -FilePath $exe.FullName -ArgumentList @('--selftest',('"'+$report+'"')) -WindowStyle Hidden -Wait -PassThru
            if ($p.ExitCode -ne 0) { throw "Real-image selftest failed: $($exe.Name), exit $($p.ExitCode)" }
            $r = Get-Content $report -Raw | ConvertFrom-Json
            if (!$r.passed -or $r.matched_people -ne 3 -or $r.blank_people -ne 0) { throw 'Invalid selftest evidence' }
          }
      - name: Reproducible photographic synthetic 15 and 30 FPS scenarios
        run: python scripts/generate_pixel_benchmark.py --source src/testdata/bus-reference.jpg --output _fixture
      - name: Interactive Win32 fixture BitBlt/DIB and UpdateLayeredWindow proof (headless runner may lack desktop)
        shell: pwsh
        continue-on-error: true
        run: |
          New-Item -ItemType Directory -Force benchmark-results/capture-test | Out-Null
          $exe = (Resolve-Path DIST/PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe).Path
          $manifest = (Resolve-Path _fixture/single_lifecycle_15fps.json).Path
          $out = Join-Path (Resolve-Path benchmark-results).Path 'capture-test'
          $p = Start-Process -FilePath $exe -ArgumentList @('--capture-test', ('"' + $manifest + '"'), ('"' + $out + '"')) -Wait -PassThru
          if ($p.ExitCode -ne 0 -or !(Test-Path (Join-Path $out 'capture-test.json'))) {
            $log = Join-Path $env:LOCALAPPDATA 'PeopleOverlay/PeopleOverlay.log'
            if (Test-Path $log) { Get-Content $log -Tail 30 | Write-Host }
            '{"passed":false,"reason":"Win32 interactive fixture capture unavailable or failed on CI host; not evidence of RVi support"}' | Out-File -Encoding utf8 (Join-Path $out 'capture-test-status.json')
            throw "Interactive Win32 capture/overlay probe failed or no interactive desktop; exit $($p.ExitCode)"
          }
          $check = Get-Content (Join-Path $out 'capture-test.json') -Raw | ConvertFrom-Json
          if (!$check.passed) { throw 'Captured proof report did not confirm Win32 success' }
      - name: Identical baseline and candidate replay (measured, simulated 300ms and 700ms delay; sequential)
        run: python scripts/run_pixel_benchmarks.py --exe v19=DIST/v19-benchmark-x64.exe --exe v20=DIST/PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe --fixtures _fixture --output benchmark-results/replay
      - name: Score all misses, false boxes, delay and identity changes
        shell: pwsh
        run: |
          $reports = Get-ChildItem benchmark-results/replay/*.json | Where-Object { $_.Name -notlike '*.process.json' } | ForEach-Object { $_.FullName }
          python scripts/evaluate_pixel_benchmark.py @reports --output benchmark-results/comparison.json
      - name: Block candidate promotion on tracking regressions versus same-run v1.9
        run: python scripts/gate_pixel_benchmark.py benchmark-results/comparison.json --max-recall-drop 0.05
      - name: Package portable downloads and source notices
        shell: pwsh
        run: |
          Remove-Item -LiteralPath DIST/v19-benchmark-x64.exe
          Remove-Item -LiteralPath DIST/v19-benchmark-x64.bundle.json
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.txt,README.md DIST
          Compress-Archive -Path DIST/* -DestinationPath PeopleOverlay_v2.0_candidate_portable.zip
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeopleOverlay_v2.0_candidate_test_evidence
          path: benchmark-results/
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: PeopleOverlay_v2.0_candidate_portable_Win7_11_x64_x86
          path: |
            DIST/*
            PeopleOverlay_v2.0_candidate_portable.zip
          retention-days: 90

  native-reference:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Install official frozen native-reference framework (builder only)
        run: python -m pip install ultralytics==8.4.78 numpy opencv-python-headless
      - name: Fetch documented bus and zidane photographic reference images
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force native-reference | Out-Null
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ultralytics/ultralytics/main/ultralytics/assets/bus.jpg' -OutFile 'native-reference/bus.jpg'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/ultralytics/ultralytics/main/ultralytics/assets/zidane.jpg' -OutFile 'native-reference/zidane.jpg'
          if ((Get-Item native-reference/bus.jpg).Length -lt 10000 -or (Get-Item native-reference/zidane.jpg).Length -lt 10000) { throw 'Official photographic references missing' }
      - name: Compare both actual NCNN models and Go decoder to official Ultralytics on real people photos
        shell: pwsh
        run: |
          python scripts/validate_native.py --v18 DIST/PeopleOverlay_v2.0_candidate_YOLOv8n_x64.exe --v19 DIST/PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe --work native-reference --go (Get-Command go).Source --download
          if ($LASTEXITCODE -ne 0) { throw 'Ultralytics / NCNN comparison failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeopleOverlay_v2.0_native_NCNN_vs_Ultralytics_evidence
          path: native-reference/native-validation.json
          retention-days: 90

  # Offline *application* replay of two filmed, independently annotated CCTV
  # corridors. The CI builder may download videos; release EXE never connects
  # to networks. This is a separate validation axis from photographic synth.
  # Edinburgh CAVIAR hosts rejected Win2022 CI connections (10060).
  # Keep it as an opt-in external connectivity test, never a fabricated pass.
  caviar-real-video:
    if: github.event_name == 'workflow_dispatch'
    needs: package
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install benchmark-only CCTV decoder dependencies
        run: python -m pip install opencv-python-headless==4.11.0.86 numpy==2.2.6 psutil==7.2.2
      - name: Retrieve original CAVIAR MPEG and hand-annotated ground truth
        run: python scripts/caviar_real_replay.py --cache _caviar_source --output _caviar_fixture --duration 10
      - name: Run true filmed-person replay for v1.9 then v20, never simultaneously
        run: python scripts/run_pixel_benchmarks.py --exe v19=DIST/v19-benchmark-x64.exe --exe v20=DIST/PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe --fixtures _caviar_fixture --output benchmark-results/caviar/replay
      - name: Score filmed-person precision recall ID switches first-detection latency and ghosts
        shell: pwsh
        run: |
          $reports = Get-ChildItem benchmark-results/caviar/replay/*.json | Where-Object { $_.Name -notlike '*.process.json' } | ForEach-Object { $_.FullName }
          python scripts/evaluate_pixel_benchmark.py @reports --output benchmark-results/caviar/comparison.json
      - name: Enforce separate real-CAVIAR quality gate before promotion
        run: python scripts/gate_pixel_benchmark.py benchmark-results/caviar/comparison.json --max-recall-drop 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeopleOverlay_v20_real_CAVIAR_video_CVML_validation
          path: |
            benchmark-results/caviar/
            _caviar_fixture/SOURCE-CAVIAR.json
          retention-days: 90

  # Public MIT-licensed pedestrian footage hosted on GitHub is accessible from
  # Actions. Manual CVAT ground truth consists of HEAD LANDMARKS, NOT bboxes:
  # report face-point coverage/identity separately, never as detection mAP.
  # This supplementary proxy MUST NOT be used as a product pass/fail gate:
  # actual person-body GT boxes and IoU are required for product acceptance.
  github-real-video:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CI-only video decoder and process monitor
        run: python -m pip install opencv-python-headless==4.11.0.86 numpy==2.2.6 psutil==7.2.2
      - name: Verify pinned public source checksums and create filmed-person head-landmark manifests
        run: python scripts/github_real_keypoint_replay.py --cache _real_source --output _real_video_fixture --duration 8
      - name: Run actual baseline and candidate NCNN on identical real video screens sequentially
        run: python scripts/run_pixel_benchmarks.py --exe v19=DIST/v19-benchmark-x64.exe --exe v20=DIST/PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe --fixtures _real_video_fixture --output benchmark-results/github-real/replay
      - name: Optional head-landmark diagnostic ONLY - NOT person detection acceptance
        shell: pwsh
        run: |
          $reports = Get-ChildItem benchmark-results/github-real/replay/*.json | Where-Object { $_.Name -notlike '*.process.json' } | ForEach-Object { $_.FullName }
          python scripts/evaluate_landmark_replay.py @reports --output benchmark-results/github-real/landmark-comparison.json
          if ($LASTEXITCODE -ne 0) { throw 'Diagnostic data processing failed; this is not person-body detection QA' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeopleOverlay_v20_real_video_manual_face_landmark_evidence
          path: |
            benchmark-results/github-real/
            _real_video_fixture/SOURCE-GITHUB-CVAT.json
          retention-days: 90

  # This is the REAL WHOLE-PERSON evaluation axis, unlike supplementary face
  # landmark plots. Official PETS2009 research CCTV frames and University of
  # Reading/OpenTraj hand-labelled full-person bboxes (identity per frame).
  # Kaggle mirror and annotations are downloaded only on the QA runner.
  pets-real-person-body:
    needs: package
    runs-on: windows-2022
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v20-internal-candidates
          path: DIST
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research-only PETS dataset downloader and pixel evaluation tools
        run: python -m pip install kagglehub pillow==12.1.1 numpy==2.2.6 psutil==7.2.2
      - name: Fetch real PETS2009 video frames and independently labelled WHOLE-BODY IDs
        run: python scripts/pets2009_person_body_replay.py --output _pets_gt_fixture --fps 15 --duration 7
      - name: Run production processing on true filmed people with body-GT (baseline and candidate in sequence)
        run: python scripts/run_pixel_benchmarks.py --exe v19=DIST/v19-benchmark-x64.exe --exe v20=DIST/PeopleOverlay_v2.0_candidate_YOLO26n_x64.exe --fixtures _pets_gt_fixture --output benchmark-results/pets2009/replay
      - name: Evaluate full person-body IoU recall precision ID continuity and missing arrivals
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-results/pets2009 | Out-Null
          $reports = Get-ChildItem benchmark-results/pets2009/replay/*.json | Where-Object { $_.Name -notlike '*.process.json' } | ForEach-Object { $_.FullName }
          python scripts/evaluate_pixel_benchmark.py @reports --output benchmark-results/pets2009/body-comparison.json
          if ($LASTEXITCODE -ne 0) { throw 'PETS2009 person-body evaluation failed' }
      - name: Block product promotion if real body bbox tracking regresses
        run: python scripts/gate_pixel_benchmark.py benchmark-results/pets2009/body-comparison.json --max-recall-drop 0.05
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PeopleOverlay_v20_PETS2009_real_video_PERSON_BODY_bbox_evidence
          path: |
            benchmark-results/pets2009/
            _pets_gt_fixture/PETS2009_PROVENANCE.json
          retention-days: 90
