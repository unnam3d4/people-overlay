name: v3 portable field trial - offline models and smoke tests
on:
  push:
    branches: [feature/people-overlay-v3, fix/overlay-over-smartpss-v361, feature/v3.6.2-multimonitor-offline]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: people-overlay-v3-portable-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Windows 7/10 x64 and x86 regression tests
        shell: pwsh
        working-directory: src
        run: |
          $env:CGO_ENABLED='0'
          foreach ($arch in @('amd64','386')) {
            $env:GOARCH=$arch
            go test -tags ncnn ./... -count=1
            if ($LASTEXITCODE -ne 0) { throw "Windows regression tests failed for $arch" }
          }
      - uses: actions/download-artifact@v4
        with:
          run-id: 39614859651
          name: PeopleOverlay_v1.9_YOLO26n_Win7_11_Verified
          github-token: ${{ github.token }}
          path: BASE26
      - uses: actions/download-artifact@v4
        with:
          run-id: 39613297202
          name: PeopleOverlay_v1.8_Fast_CCTV_PersonLock_Win7
          github-token: ${{ github.token }}
          path: BASE8
      - name: Pack fresh v3 EXE with verified embedded model and compatible DLL
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p DIST
          for pair in 'amd64 x64' '386 x86'; do
            read -r goarch arch <<< "$pair"
            (cd src && CGO_ENABLED=0 GOOS=windows GOARCH="$goarch" go build -tags ncnn -trimpath -ldflags '-s -w -H windowsgui' -o "../app-$arch.exe" .)
            python scripts/package_current.py --application "app-$arch.exe" --donor "BASE26/PeopleOverlay_v1.9_YOLO26n_$arch.exe" --output "DIST/PeopleOverlay_v3_YOLO26n_$arch.exe"
            python scripts/package_current.py --application "app-$arch.exe" --donor "BASE8/PeopleOverlay_Win7_NCNN_$arch.exe" --output "DIST/PeopleOverlay_v3_YOLOv8n_$arch.exe"
          done
      - name: Verify standalone offline x64/x86 EXEs include matching native DLL and AI resources
        shell: pwsh
        run: |
          python scripts/verify_offline_bundle.py DIST
          if ($LASTEXITCODE -ne 0) { throw "Offline model/DLL bundle validation failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: v3-portable-unverified-internal
          path: DIST/
          retention-days: 14

  field-trial:
    needs: build
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: v3-portable-unverified-internal
          path: DIST
      - name: Validate positive and empty people detection in every packed EXE
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          foreach ($exe in Get-ChildItem DIST/PeopleOverlay_v3_YOLO*.exe) {
            $report = Join-Path (Resolve-Path evidence).Path ($exe.BaseName + '.json')
            $proc = Start-Process -FilePath $exe.FullName -ArgumentList @('--selftest',('"' + $report + '"')) -Wait -PassThru
            if ($proc.ExitCode -ne 0 -or !(Test-Path $report)) { throw "Selftest failed: $($exe.Name)" }
            $data = Get-Content $report -Raw | ConvertFrom-Json
            if (!$data.passed -or $data.matched_people -ne 3 -or $data.blank_people -ne 0) { throw "Invalid person detection: $($exe.Name)" }
          }
      - name: Package clearly labeled experimental offline download
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force RELEASE | Out-Null
          Get-ChildItem DIST/PeopleOverlay_v3_YOLO*.exe | Copy-Item -Destination RELEASE
          Get-ChildItem DIST/PeopleOverlay_v3_YOLO*.bundle.json | Copy-Item -Destination RELEASE
          Copy-Item README.md,BENCHMARK.md,LICENSE,THIRD_PARTY_NOTICES.txt RELEASE
          @'
          PEOPLE OVERLAY v3.6.2 - MULTI-MONITOR / OFFLINE EXPERIMENT

          TARGET: Windows 7 SP1 / Windows 10 x86 (32-bit) and x64 (64-bit).
          NO INTERNET ON OPERATOR PC. Every EXE embeds model.param, model.bin
          and matching ncnnbridge.dll. First start extracts these to
          %LOCALAPPDATA%\\PeopleOverlay; a writable user profile is required.
          No Python, GPU, CUDA or separate AI model download is needed.
          32-bit computers require CPU SSE2.

          CHOOSE ONLY ONE EXE:
          * For Windows x64: PeopleOverlay_v3_YOLO26n_x64.exe
          * For Windows x86: PeopleOverlay_v3_YOLO26n_x86.exe
          YOLO26n is the user's preferred tested variant; YOLOv8n alternatives
          are included for comparison, but NOT simultaneous use.

          Detection: all physical monitors (up to 4) automatically.
          Every monitor has an independent click-through corner layer,
          video capture, tracker and Auto layout. The CPU AI worker is shared.
          Tray 'Snapshot: monitor N' selects only the diagnostic screenshot.
          Ctrl+Alt+F9: toggle detection; Ctrl+Alt+F10: exit;
          Ctrl+Alt+F7: mute; Ctrl+Alt+F6: test corners on EACH display;
          Ctrl+Alt+F5: restore transparent corner windows on ALL displays.
          Before starting a new build CLOSE the older running EXE.

          WINDOWS 7/10 x86/x64 CI tests, bundled-model SHA256, correct DLL
          architecture and packaged positive/negative person tests must pass.
          Real Windows 7, physical 4-monitor RVi and SmartPSS fullscreen
          modes were NOT tested in CI; DX/GPU exclusive surfaces may still
          hide overlays. These are known remaining compatibility risks.
          Up to 48 cameras and 2-second detection are NOT guaranteed.
          Never use this application as the sole safety/security alarm.
          '@ | Out-File RELEASE/READ-ME-FIRST.txt -Encoding utf8
          Compress-Archive -Path RELEASE/* -DestinationPath PeopleOverlay_v3_6_2_MULTI_MONITOR_OFFLINE.zip
      - uses: actions/upload-artifact@v4
        with:
          name: PeopleOverlay_v3_6_2_MULTI_MONITOR_OFFLINE_Win7_10_x64_x86
          path: PeopleOverlay_v3_6_2_MULTI_MONITOR_OFFLINE.zip
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: PeopleOverlay_v3_6_2_packed_model_selftests
          path: evidence/
          retention-days: 30
