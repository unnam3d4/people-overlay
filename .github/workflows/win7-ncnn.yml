name: Win7 tray and stable tracking QA

on:
  push:
    branches: [fix/win7-tray-stable-tracks]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ncnn:
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - name: Install cross compilers
        run: sudo apt-get update -qq && sudo apt-get install -y ninja-build g++-mingw-w64-x86-64 g++-mingw-w64-i686 mingw-w64-tools
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fast Go tests and Windows cross-compilation preflight
        working-directory: src
        run: |
          go test -v ./...
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags ncnn -o /tmp/people-overlay-x64-check.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -tags ncnn -o /tmp/people-overlay-x86-check.exe .
      - name: Install export dependencies on builder only
        run: |
          python -m pip install --quiet numpy==1.26.4 torch==2.3.1 torchvision==0.18.1 ultralytics==8.3.0 pnnx ncnn
      - name: Convert real pretrained YOLOv8n to NCNN
        run: python scripts/export_ncnn.py _ncnn_model
      - name: Build Win7 x64 and x86 NCNN native backend
        run: bash scripts/build_ncnn.sh
      - name: Unit tests
        working-directory: src
        run: go test -v ./...
      - name: Compile Windows EXEs with no CGo dependency
        run: |
          cd src
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -tags ncnn -trimpath -ldflags '-s -w -H windowsgui' -o ../_output/x64/PeopleOverlay_Win7_NCNN_x64.exe .
          CGO_ENABLED=0 GOOS=windows GOARCH=386 go build -tags ncnn -trimpath -ldflags '-s -w -H windowsgui' -o ../_output/x86/PeopleOverlay_Win7_NCNN_x86.exe .
      - name: Embed model and runtime in standalone EXEs
        run: python scripts/pack_ncnn.py
      - uses: actions/upload-artifact@v4
        with:
          name: internal-build-not-yet-tested
          path: RELEASE_NCNN/*.exe
          retention-days: 1
  smoke-win:
    needs: build-ncnn
    runs-on: windows-2022
    timeout-minutes: 12
    steps:
      - name: Download unverified binaries
        uses: actions/download-artifact@v4
        with:
          name: internal-build-not-yet-tested
          path: DIST
      - name: Test x64 and x86 real inference
        shell: pwsh
        run: |
          foreach ($arch in @('x64','x86')) {
            $exe = Join-Path (Resolve-Path ./DIST).Path "PeopleOverlay_Win7_NCNN_$arch.exe"
            Write-Host "Testing actual embedded NCNN YOLOv8n $arch ..."
            $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -Wait -PassThru
            if ($p.ExitCode -ne 0) {
              $log = Join-Path $env:LOCALAPPDATA 'PeopleOverlay/PeopleOverlay.log'
              if (Test-Path $log) { Get-Content $log -Tail 50 | Write-Host }
              throw "Embedded NCNN inference failed for $arch, code $($p.ExitCode)"
            }
            Write-Host "PASS: $arch model loading and inference" -ForegroundColor Green
          }
      - name: Publish verified portable EXEs
        uses: actions/upload-artifact@v4
        with:
          name: PeopleOverlay_v1.1_Win7_Stability_Fix
          path: DIST/*.exe
          retention-days: 30
